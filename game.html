<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a13">
  <title>LUDO MASTER PRO - Arena</title>
  
  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-shell">
    <!-- Header Controls -->
    <div class="top-bar">
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="font-weight: 800; font-size: 0.9rem;" id="player-profile-name">Player</div>
        <div id="top-room-badge" class="room-badge" onclick="copyRoomCode()">ROOM: <span id="top-room-code">------</span> 📋</div>
      </div>
      <div class="coin-badge">🟡 <span id="player-coin-count">1000</span> Coins</div>
      <button type="button" class="ctrl-btn" style="background:#ef4444;" onclick="logout()">Logout</button>
    </div>

    <!-- Matchmaking Lobby Screen -->
    <div id="screen-lobby" class="screen active">
      <div class="lobby-box">
        <h2 style="color:var(--gold);">MATCHMAKING</h2>
        <p style="font-size:0.8rem; color:var(--text-muted);">Speed 15s • Fee: 100 Coins / Match</p>

        <!-- Rejoin Card -->
        <div id="rejoin-prompt" class="rejoin-card">
          <div style="font-size:0.85rem; color:#4ade80; font-weight:800; margin-bottom:6px;">⚡ Active Match Found!</div>
          <button type="button" class="btn-main" style="background:#16a34a; padding:9px;" onclick="resumeSavedMatch()">Rejoin Match Now</button>
        </div>

        <button type="button" class="btn-main btn-gold" id="btn-create-room" onclick="createRoom()">👑 CREATE ROOM</button>
        
        <div style="display:flex; gap:6px;">
          <input type="text" id="room-code-input" class="input-field" placeholder="Room Code">
          <button type="button" class="btn-main" style="width:110px;" onclick="joinRoom()">JOIN</button>
        </div>

        <div style="border-top:1px solid rgba(255,255,255,0.1); margin:4px 0;"></div>
        <button type="button" class="btn-main" style="background:#334155;" id="btn-play-comp" onclick="startOfflineMode()">🤖 PLAY VS COMPUTER</button>
      </div>
    </div>

    <!-- Active Gameplay Screen -->
    <div id="screen-game" class="screen">
      <!-- Opponent Deck (Yellow) -->
      <div id="deck-yellow" class="deck">
        <div class="player-profile">
          <div id="avatar-yellow-box" class="avatar-circle avatar-yellow">
            🟡
            <div class="speaking-wave"></div>
          </div>
          <div class="details">
            <h4 id="name-yellow">Opponent</h4>
            <div>
              <span id="score-yellow" class="status-chip">0/4 Home</span>
              <span id="hearts-yellow" class="hearts-row">❤️❤️❤️</span>
              <span id="timer-yellow" class="turn-timer">15s</span>
            </div>
          </div>
        </div>
        <div class="dice-wrap">
          <div id="dice-yellow" class="dice-cube disabled" data-val="1">
            <div class="pip dp1" style="grid-area:1/1;"></div><div class="pip dp2" style="grid-area:1/2;"></div><div class="pip dp3" style="grid-area:1/3;"></div>
            <div class="pip dp4" style="grid-area:2/1;"></div><div class="pip dp5" style="grid-area:2/2;"></div><div class="pip dp6" style="grid-area:2/3;"></div>
            <div class="pip dp7" style="grid-area:3/1;"></div><div class="pip dp8" style="grid-area:3/2;"></div><div class="pip dp9" style="grid-area:3/3;"></div>
          </div>
        </div>
      </div>

      <div id="status-msg" class="status-banner">Game Ready!</div>

      <div class="board-frame">
        <canvas id="boardCanvas" width="600" height="600"></canvas>
      </div>

      <!-- Player Deck (Red) -->
      <div id="deck-red" class="deck active-turn">
        <div class="player-profile">
          <div id="avatar-red-box" class="avatar-circle avatar-red">
            🔴
            <div class="speaking-wave"></div>
          </div>
          <div class="details">
            <h4 id="name-red">You</h4>
            <div>
              <span id="score-red" class="status-chip">0/4 Home</span>
              <span id="hearts-red" class="hearts-row">❤️❤️❤️</span>
              <span id="timer-red" class="turn-timer">15s</span>
            </div>
          </div>
        </div>
        <div class="ctrl-group">
          <button type="button" id="mic-toggle-btn" class="ctrl-btn" onclick="toggleVoiceChat()">🎙️ Mic Off</button>
          <button type="button" id="speaker-toggle-btn" class="ctrl-btn" onclick="toggleSpeaker()">🔊 On</button>
          <button type="button" class="ctrl-btn" onclick="toggleChatDrawer()">💬 Chat</button>
          <div class="dice-wrap">
            <div id="dice-red" class="dice-cube" data-val="1">
              <div class="pip dp1" style="grid-area:1/1;"></div><div class="pip dp2" style="grid-area:1/2;"></div><div class="pip dp3" style="grid-area:1/3;"></div>
              <div class="pip dp4" style="grid-area:2/1;"></div><div class="pip dp5" style="grid-area:2/2;"></div><div class="pip dp6" style="grid-area:2/3;"></div>
              <div class="pip dp7" style="grid-area:3/1;"></div><div class="pip dp8" style="grid-area:3/2;"></div><div class="pip dp9" style="grid-area:3/3;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick Reaction Bar -->
      <div class="chat-strip">
        <span class="chat-emoji" onclick="sendReaction('😂')">😂</span>
        <span class="chat-emoji" onclick="sendReaction('🔥')">🔥</span>
        <span class="chat-emoji" onclick="sendReaction('👑')">👑</span>
        <span class="chat-emoji" onclick="sendReaction('💀')">💀</span>
        <span class="chat-emoji" onclick="sendReaction('🚀')">🚀</span>
      </div>
    </div>
  </div>

  <!-- In-Game Chat Drawer -->
  <div id="chat-drawer" class="chat-drawer">
    <div class="chat-header">
      <span>ROOM CHAT</span>
      <button type="button" class="ctrl-btn" style="padding:2px 8px;" onclick="toggleChatDrawer()">✕</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-text-input" class="input-field" placeholder="Type message..." maxlength="70" style="margin-bottom:0;" onkeydown="if(event.key==='Enter') sendChatMessage()">
      <button type="button" class="btn-main" style="width:80px; padding:8px;" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <!-- Modular Scripts with Defer Sequencing -->
  <script src="sound.js" defer></script>
  <script src="webrtc.js" defer></script>
  <script src="game.js" defer></script>
</body>
</html>
